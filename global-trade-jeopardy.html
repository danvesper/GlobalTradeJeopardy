<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Trade Jeopardy</title>
<style>
  :root{
    --board-bg: #060ce0;
    --board-bg-2: #0a13ff;
    --cell-bg: #1013a8;
    --cell-bg-hover: #171bd6;
    --cell-used: #04074a;
    --gold: #ffcc33;
    --gold-soft: #f5d98b;
    --text-on-board: #ffffff;
    --page-bg: #eef0f8;
    --page-bg-2: #ffffff;
    --panel-bg: #ffffff;
    --panel-border: #d8dceb;
    --ink: #14172b;
    --ink-soft: #55597a;
    --accent: #0a13ff;
    --accent-2: #d0263a;
    --shadow: 0 10px 30px rgba(10,19,255,0.15);
    --modal-overlay: rgba(4,6,40,0.72);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --page-bg: #0b0c16;
      --page-bg-2: #12142400;
      --panel-bg: #161829;
      --panel-border: #2a2d47;
      --ink: #f1f2fb;
      --ink-soft: #b6b9d6;
      --shadow: 0 10px 30px rgba(0,0,0,0.5);
      --modal-overlay: rgba(0,0,0,0.82);
    }
  }
  :root[data-theme="dark"]{
    --page-bg: #0b0c16;
    --page-bg-2: #12142400;
    --panel-bg: #161829;
    --panel-border: #2a2d47;
    --ink: #f1f2fb;
    --ink-soft: #b6b9d6;
    --shadow: 0 10px 30px rgba(0,0,0,0.5);
    --modal-overlay: rgba(0,0,0,0.82);
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background: var(--page-bg);
    color: var(--ink);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height:100vh;
  }
  .wrap{
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  header{
    text-align:center;
    margin-bottom: 18px;
  }
  h1{
    font-family: 'Trebuchet MS', Arial, sans-serif;
    font-weight: 900;
    letter-spacing: 1px;
    font-size: clamp(24px, 4vw, 40px);
    color: var(--accent);
    margin: 6px 0 4px;
    text-shadow: 2px 2px 0 var(--gold-soft);
  }
  .subtitle{
    color: var(--ink-soft);
    font-family: Arial, sans-serif;
    font-size: 14px;
  }

  .scoreboard{
    display:flex;
    gap: 14px;
    justify-content:center;
    flex-wrap: wrap;
    margin: 16px 0 22px;
  }
  .team-card{
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    border-radius: 14px;
    padding: 12px 18px;
    min-width: 190px;
    text-align:center;
    box-shadow: var(--shadow);
  }
  .team-card input.team-name{
    font-family: 'Trebuchet MS', Arial, sans-serif;
    font-weight: 700;
    font-size: 15px;
    text-align:center;
    border: none;
    background: transparent;
    color: var(--ink);
    width: 100%;
    outline: none;
    border-bottom: 1px dashed var(--panel-border);
    padding-bottom: 4px;
  }
  .team-score{
    font-family: Arial, sans-serif;
    font-size: 30px;
    font-weight: 800;
    margin: 8px 0 6px;
  }
  .team-card.t1 .team-score{ color: var(--accent); }
  .team-card.t2 .team-score{ color: var(--accent-2); }
  .score-buttons{
    display:flex; gap:6px; justify-content:center;
  }
  .score-buttons button{
    font-family: Arial, sans-serif;
    font-size: 13px;
    border: 1px solid var(--panel-border);
    background: var(--page-bg);
    color: var(--ink);
    border-radius: 8px;
    padding: 4px 10px;
    cursor:pointer;
  }
  .score-buttons button:hover{ filter: brightness(1.08); }

  .controls{
    text-align:center;
    margin-bottom: 18px;
    font-family: Arial, sans-serif;
  }
  .controls button{
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    font-weight:600;
  }
  .controls button:hover{ filter: brightness(1.1); }

  .board{
    background: linear-gradient(180deg, var(--board-bg), var(--board-bg-2));
    border-radius: 16px;
    padding: 10px;
    box-shadow: var(--shadow);
    overflow-x: auto;
  }
  table.grid{
    border-collapse: separate;
    border-spacing: 6px;
    width: 100%;
    min-width: 760px;
  }
  .cat-header{
    background: var(--accent);
    color: var(--gold);
    font-family: 'Trebuchet MS', Arial, sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    text-align: center;
    padding: 10px 6px;
    border-radius: 8px;
    font-size: clamp(11px, 1.4vw, 14px);
    line-height: 1.2;
    vertical-align: middle;
  }
  td.cell{
    background: var(--cell-bg);
    border-radius: 8px;
    text-align: center;
    vertical-align: middle;
    cursor: pointer;
    padding: 0;
    height: 62px;
  }
  td.cell .value{
    color: var(--gold);
    font-family: 'Trebuchet MS', Arial, sans-serif;
    font-weight: 800;
    font-size: clamp(16px, 2.2vw, 24px);
    text-shadow: 1px 1px 0 rgba(0,0,0,0.35);
  }
  td.cell:hover{ background: var(--cell-bg-hover); }
  td.cell.used{
    background: var(--cell-used);
    cursor: default;
  }
  td.cell.used .value{ opacity: 0; }
  td.cell.empty{
    background: transparent;
    cursor: default;
  }

  /* Modal */
  .overlay{
    position: fixed; inset: 0;
    background: var(--modal-overlay);
    display: none;
    align-items: center; justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .overlay.open{ display:flex; }
  .clue-card{
    background: linear-gradient(180deg, var(--board-bg), var(--board-bg-2));
    color: #fff;
    border-radius: 18px;
    max-width: 700px;
    width: 100%;
    padding: 40px 32px 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    position: relative;
  }
  .clue-card .cat-tag{
    font-family: Arial, sans-serif;
    color: var(--gold);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
    opacity: 0.9;
  }
  .clue-card .clue-text{
    font-family: 'Trebuchet MS', Arial, sans-serif;
    font-size: clamp(18px, 3vw, 26px);
    font-weight: 700;
    line-height: 1.4;
    min-height: 90px;
    display:flex; align-items:center; justify-content:center;
  }
  .clue-card .answer-text{
    display:none;
    margin-top: 14px;
    font-family: Arial, sans-serif;
    font-size: clamp(16px, 2.4vw, 20px);
    color: var(--gold);
    font-weight: 700;
  }
  .clue-card .answer-text.show{ display:block; }
  .clue-actions{
    margin-top: 26px;
    display:flex;
    gap: 10px;
    justify-content:center;
    flex-wrap: wrap;
  }
  .clue-actions button{
    font-family: Arial, sans-serif;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-reveal{ background: var(--gold); color: #1a1a1a; }
  .btn-close{ background: rgba(255,255,255,0.15); color: #fff; }
  .award-row{
    display:none;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.2);
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  .award-row.show{ display:flex; }
  .award-row button{
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 700;
    border-radius: 10px;
    padding: 9px 14px;
    border: none;
    cursor: pointer;
  }
  .btn-t1{ background: #cfe0ff; color: #0a13ff; }
  .btn-t2{ background: #ffd6dc; color: #d0263a; }
  .btn-none{ background: rgba(255,255,255,0.15); color: #fff; }

  footer.note{
    text-align:center;
    color: var(--ink-soft);
    font-family: Arial, sans-serif;
    font-size: 12px;
    margin-top: 18px;
  }

  @media (max-width: 640px){
    table.grid{ min-width: 620px; }
  }

  /* Accessibility additions */
  .sr-only{
    position:absolute; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  a:focus-visible, button:focus-visible, td.cell:focus-visible, input:focus-visible{
    outline: 3px solid #ff9d00;
    outline-offset: 2px;
  }
  td.cell button.cell-btn{
    all: unset;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%; height:100%;
    min-height:62px;
    cursor:pointer;
  }
  td.cell button.cell-btn:disabled{ cursor:default; }
  .a11y-controls{
    text-align:center;
    margin: 0 0 14px;
    font-family: Arial, sans-serif;
  }
  .a11y-controls button{
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    color: var(--ink);
    border-radius: 10px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight:600;
    margin: 0 4px;
  }
  .a11y-controls button[aria-pressed="true"]{
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  body.large-text{ font-size: 118%; }
  body.large-text .clue-card .clue-text{ font-size: clamp(20px, 3.6vw, 32px); }
  body.large-text .clue-card .answer-text{ font-size: clamp(18px, 2.8vw, 24px); }
  body.large-text td.cell .value{ font-size: clamp(18px, 2.6vw, 28px); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌐 Global Trade Jeopardy</h1>
    <div class="subtitle">Click a dollar value to reveal the clue. Read it like a statement — answer in the form of a question!</div>
  </header>

  <div class="a11y-controls">
    <button id="largeTextBtn" aria-pressed="false" onclick="toggleLargeText()">🔎 Larger Text</button>
  </div>

  <div aria-live="polite" class="sr-only" id="liveRegion"></div>

  <div class="scoreboard">
    <div class="team-card t1">
      <label class="sr-only" for="t1name">Team 1 name</label>
      <input class="team-name" id="t1name" value="Team Blue" maxlength="20">
      <div class="team-score" id="t1score" aria-label="Team Blue score">0</div>
      <div class="score-buttons">
        <button onclick="adjustScore(1,100)" aria-label="Add 100 points to Team Blue">+100</button>
        <button onclick="adjustScore(1,-100)" aria-label="Subtract 100 points from Team Blue">−100</button>
      </div>
    </div>
    <div class="team-card t2">
      <label class="sr-only" for="t2name">Team 2 name</label>
      <input class="team-name" id="t2name" value="Team Red" maxlength="20">
      <div class="team-score" id="t2score" aria-label="Team Red score">0</div>
      <div class="score-buttons">
        <button onclick="adjustScore(2,100)" aria-label="Add 100 points to Team Red">+100</button>
        <button onclick="adjustScore(2,-100)" aria-label="Subtract 100 points from Team Red">−100</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="resetGame()">🔄 Reset Game</button>
  </div>

  <div class="board">
    <table class="grid" id="board" role="grid" aria-label="Jeopardy board"></table>
  </div>

  <footer class="note">33 global economic & trade concepts across 6 categories · Scores are per-session and reset on reload</footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="clueCat" aria-describedby="clueText">
  <div class="clue-card">
    <div class="cat-tag" id="clueCat">Category</div>
    <div class="clue-text" id="clueText">Clue text</div>
    <div class="answer-text" id="answerText" aria-live="polite">What is...?</div>
    <div class="clue-actions">
      <button class="btn-reveal" id="revealBtn" onclick="revealAnswer()">Reveal Answer</button>
      <button class="btn-close" id="closeBtn" onclick="closeClue()">Close</button>
    </div>
    <div class="award-row" id="awardRow">
      <button class="btn-t1" onclick="awardPoint(1)">✔ Award <span id="awardT1name">Team Blue</span></button>
      <button class="btn-t2" onclick="awardPoint(2)">✔ Award <span id="awardT2name">Team Red</span></button>
      <button class="btn-none" onclick="closeClue()">No one got it</button>
    </div>
  </div>
</div>

<script>
const categories = [
  {
    name: "Trade Basics",
    clues: [
      { value:100, clue:"Buying goods or services from another country and bringing them into your own.", answer:"What is importing?" },
      { value:200, clue:"Selling goods or services to another country.", answer:"What is exporting?" },
      { value:300, clue:"A policy allowing countries to trade with minimal government interference — no tariffs, no quotas.", answer:"What is free trade?" },
      { value:400, clue:"Government policies, like tariffs and quotas, designed to shield domestic industries from foreign competition.", answer:"What is trade protectionism?" },
      { value:500, clue:"Contracting business processes or jobs to a company in another country to cut costs.", answer:"What is offshore outsourcing?" },
      { value:600, clue:"The shared values, beliefs, customs, and behaviors of a group that companies must understand before entering a foreign market.", answer:"What is culture?" }
    ]
  },
  {
    name: "Advantage & Balance",
    clues: [
      { value:100, clue:"The ability of a country to produce a good at a lower opportunity cost than another country.", answer:"What is comparative advantage?" },
      { value:200, clue:"The ability of a country to produce a good using fewer resources than another country.", answer:"What is absolute advantage?" },
      { value:300, clue:"The difference between the value of a country's exports and its imports.", answer:"What is the balance of trade?" },
      { value:400, clue:"This occurs when a country's exports exceed its imports.", answer:"What is a trade surplus?" },
      { value:500, clue:"This occurs when a country's imports exceed its exports.", answer:"What is a trade deficit?" },
      { value:600, clue:"A complete record of all economic transactions between a country's residents and the rest of the world.", answer:"What is the balance of payments?" }
    ]
  },
  {
    name: "Trade Agreements & Barriers",
    clues: [
      { value:100, clue:"A tax placed on imported goods that makes them more expensive than domestic products.", answer:"What is a tariff?" },
      { value:200, clue:"A limit on the quantity of a good that can be imported during a given period.", answer:"What is an import quota?" },
      { value:300, clue:"A complete ban on trade with a particular country.", answer:"What is an embargo?" },
      { value:400, clue:"Signed in 1947, this agreement aimed to reduce tariffs and expand international trade, and eventually became the WTO.", answer:"What is the General Agreement on Tariffs and Trade (GATT)?" },
      { value:500, clue:"This international organization sets global trade rules and resolves disputes between member nations.", answer:"What is the World Trade Organization (WTO)?" },
      { value:600, clue:"A group of countries that removes trade barriers among members and allows free movement of labor and capital.", answer:"What is a common market?" }
    ]
  },
  {
    name: "Going Global",
    clues: [
      { value:100, clue:"An agreement letting one company produce another's product or use its trademark in exchange for a fee.", answer:"What is licensing?" },
      { value:200, clue:"A business arrangement where one party grants another the right to operate under its brand and business system.", answer:"What is franchising?" },
      { value:300, clue:"An arrangement in which a company hires a foreign firm to manufacture its goods.", answer:"What is contract manufacturing?" },
      { value:400, clue:"A business arrangement in which two or more companies share ownership of a new, jointly created enterprise.", answer:"What is a joint venture?" },
      { value:500, clue:"A partnership in which companies share resources and cooperate on a project without creating a separate legal entity.", answer:"What is a strategic alliance?" }
    ]
  },
  {
    name: "Investment & Corporations",
    clues: [
      { value:100, clue:"When a company invests directly in facilities to produce or market goods in a foreign country.", answer:"What is foreign direct investment (FDI)?" },
      { value:200, clue:"A company that is owned or controlled by a foreign parent company.", answer:"What is a foreign subsidiary?" },
      { value:300, clue:"A company that operates and owns assets in two or more countries.", answer:"What is a multinational corporation (MNC)?" },
      { value:400, clue:"State-owned investment funds used by governments to invest surplus revenue for the country's economic benefit.", answer:"What are sovereign wealth funds?" },
      { value:500, clue:"This 1994 agreement eliminated most trade barriers between the U.S., Canada, and Mexico, later replaced by the USMCA.", answer:"What is NAFTA (North American Free Trade Agreement)?" }
    ]
  },
  {
    name: "Money Matters",
    clues: [
      { value:100, clue:"The value of one country's currency in terms of another country's currency.", answer:"What is the exchange rate?" },
      { value:200, clue:"A deliberate downward adjustment of a country's currency value relative to other currencies.", answer:"What is devaluation?" },
      { value:300, clue:"Selling products in a foreign market at a price lower than at home, or below the cost of production.", answer:"What is dumping?" },
      { value:400, clue:"An international trade practice where goods or services are exchanged for other goods or services instead of hard currency.", answer:"What is countertrading?" },
      { value:500, clue:"The direct exchange of goods or services between parties without using money.", answer:"What is bartering?" }
    ]
  }
];

let scores = {1:0, 2:0};
let currentCell = null; // {catIdx, clueIdx, el}

function buildBoard(){
  const table = document.getElementById('board');
  table.innerHTML = '';

  const headerRow = document.createElement('tr');
  headerRow.setAttribute('role','row');
  categories.forEach(cat => {
    const th = document.createElement('th');
    th.className = 'cat-header';
    th.scope = 'col';
    th.textContent = cat.name;
    headerRow.appendChild(th);
  });
  table.appendChild(headerRow);

  const maxRows = Math.max(...categories.map(c => c.clues.length));
  for(let r=0; r<maxRows; r++){
    const row = document.createElement('tr');
    row.setAttribute('role','row');
    categories.forEach((cat, ci) => {
      const td = document.createElement('td');
      const clue = cat.clues[r];
      if(clue){
        td.className = 'cell';
        td.dataset.cat = ci;
        td.dataset.idx = r;
        const btn = document.createElement('button');
        btn.className = 'cell-btn';
        btn.type = 'button';
        btn.innerHTML = `<span class="value" aria-hidden="true">$${clue.value}</span>`;
        btn.setAttribute('aria-label', `${cat.name}, $${clue.value}`);
        btn.addEventListener('click', () => openClue(ci, r, td, btn));
        td.appendChild(btn);
      } else {
        td.className = 'cell empty';
      }
      row.appendChild(td);
    });
    table.appendChild(row);
  }
}

let lastFocusedCell = null;

function openClue(catIdx, idx, el, btn){
  if(el.classList.contains('used')) return;
  currentCell = {catIdx, idx, el, btn};
  lastFocusedCell = btn;
  const cat = categories[catIdx];
  const clue = cat.clues[idx];
  document.getElementById('clueCat').textContent = `${cat.name} — $${clue.value}`;
  document.getElementById('clueText').textContent = clue.clue;
  const ansEl = document.getElementById('answerText');
  ansEl.textContent = '';
  ansEl.dataset.answer = clue.answer;
  ansEl.classList.remove('show');
  document.getElementById('revealBtn').style.display = 'inline-block';
  document.getElementById('awardRow').classList.remove('show');
  document.getElementById('awardT1name').textContent = document.getElementById('t1name').value || 'Team 1';
  document.getElementById('awardT2name').textContent = document.getElementById('t2name').value || 'Team 2';
  const overlay = document.getElementById('overlay');
  overlay.classList.add('open');
  // Move focus into the dialog for keyboard/screen-reader users
  document.getElementById('revealBtn').focus();
}

function revealAnswer(){
  const ansEl = document.getElementById('answerText');
  ansEl.textContent = ansEl.dataset.answer;
  ansEl.classList.add('show');
  document.getElementById('revealBtn').style.display = 'none';
  document.getElementById('awardRow').classList.add('show');
  // Focus the first award button so keyboard users can continue without hunting
  document.querySelector('#awardRow .btn-t1').focus();
}

function closeClue(){
  if(currentCell){
    currentCell.el.classList.add('used');
    if(currentCell.btn){
      currentCell.btn.disabled = true;
      currentCell.btn.setAttribute('aria-label', currentCell.btn.getAttribute('aria-label') + ', already answered');
    }
  }
  document.getElementById('overlay').classList.remove('open');
  currentCell = null;
  // Return focus to the board cell that was opened, so keyboard users don't lose their place
  if(lastFocusedCell){
    lastFocusedCell.focus();
  }
}

function awardPoint(team){
  if(!currentCell) return;
  const clue = categories[currentCell.catIdx].clues[currentCell.idx];
  scores[team] += clue.value;
  updateScores(team, clue.value);
  closeClue();
}

function adjustScore(team, amount){
  scores[team] += amount;
  updateScores(team, amount);
}

function updateScores(changedTeam, delta){
  document.getElementById('t1score').textContent = scores[1];
  document.getElementById('t2score').textContent = scores[2];
  if(changedTeam){
    const name = document.getElementById(`t${changedTeam}name`).value || `Team ${changedTeam}`;
    const sign = delta >= 0 ? 'gains' : 'loses';
    document.getElementById('liveRegion').textContent = `${name} ${sign} ${Math.abs(delta)} points. New score: ${scores[changedTeam]}.`;
  }
}

function resetGame(){
  if(!confirm('Reset the board and scores?')) return;
  scores = {1:0, 2:0};
  updateScores();
  buildBoard();
}

function toggleLargeText(){
  const btn = document.getElementById('largeTextBtn');
  const isOn = document.body.classList.toggle('large-text');
  btn.setAttribute('aria-pressed', String(isOn));
}

// Close on Escape, and trap Tab focus within the open dialog
document.addEventListener('keydown', (e) => {
  const overlay = document.getElementById('overlay');
  if(!overlay.classList.contains('open')) return;
  if(e.key === 'Escape'){
    closeClue();
    return;
  }
  if(e.key === 'Tab'){
    const focusable = overlay.querySelectorAll('button:not([style*="display: none"])');
    const visible = Array.from(focusable).filter(b => b.offsetParent !== null);
    if(visible.length === 0) return;
    const first = visible[0];
    const last = visible[visible.length - 1];
    if(e.shiftKey && document.activeElement === first){
      e.preventDefault();
      last.focus();
    } else if(!e.shiftKey && document.activeElement === last){
      e.preventDefault();
      first.focus();
    }
  }
});

buildBoard();
</script>
</body>
</html>
